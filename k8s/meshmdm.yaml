---
apiVersion: v1
kind: Namespace
metadata:
  name: meshmdm
---
# ==============================================================================
# 1. Config & Secrets
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: meshmdm-secrets
  namespace: meshmdm
type: Opaque
stringData:
  mysql-root-password: "meshmdmrootpass"
  mysql-password: "meshmdmpassword"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: meshmdm-config
  namespace: meshmdm
data:
  FLEET_MYSQL_ADDRESS: "mysql-service.meshmdm.svc.cluster.local:3306"
  FLEET_MYSQL_DATABASE: "meshmdm"
  FLEET_MYSQL_USERNAME: "meshmdm"
  FLEET_REDIS_ADDRESS: "redis-service.meshmdm.svc.cluster.local:6379"
  FLEET_SERVER_ADDRESS: "0.0.0.0:8080"
  FLEET_SERVER_TLS: "false"
  FLEET_DEV_LICENSE: "true"
---
# ==============================================================================
# 2. MySQL Database
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: meshmdm
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meshmdm-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: "meshmdm"
            - name: MYSQL_USER
              value: "meshmdm"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meshmdm-secrets
                  key: mysql-password
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: meshmdm
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ==============================================================================
# 3. Redis Cache
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: meshmdm
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: meshmdm
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ==============================================================================
# 4. Mesh MDM Server
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshmdm
  namespace: meshmdm
  labels:
    app: meshmdm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshmdm
  template:
    metadata:
      labels:
        app: meshmdm
    spec:
      containers:
        - name: meshmdm
          image: ghcr.io/meshingolala/meshmdm:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: meshmdm-config
          env:
            - name: FLEET_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meshmdm-secrets
                  key: mysql-password
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: meshmdm-service
  namespace: meshmdm
spec:
  type: LoadBalancer
  selector:
    app: meshmdm
  ports:
    - port: 8080
      targetPort: 8080
      name: http
