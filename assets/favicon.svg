<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M64 8 L112 28 L112 74 L64 120 L16 74 L16 28 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="6" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Inner Circuit Web -->
  <line x1="64" y1="36" x2="64" y2="64" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="64" y2="92" stroke="#d946ef" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="38" y2="49" stroke="#00f5ff" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="90" y2="49" stroke="#00f5ff" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="38" y2="79" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="90" y2="79" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Perimeter Connectors -->
  <line x1="16" y1="28" x2="38" y2="49" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="112" y1="28" x2="90" y2="49" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="8" x2="64" y2="36" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="49" x2="38" y2="79" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="49" x2="90" y2="79" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="79" x2="64" y2="92" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="79" x2="64" y2="92" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="92" x2="64" y2="120" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <line x1="16" y1="74" x2="38" y2="79" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <line x1="112" y1="74" x2="90" y2="79" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>

  <!-- Vertices / Nodes -->
  <circle cx="64" cy="8" r="6" fill="#00f5ff" filter="url(#glow)"/>
  <circle cx="16" cy="28" r="6" fill="#00f5ff" filter="url(#glow)"/>
  <circle cx="112" cy="28" r="6" fill="#00f5ff" filter="url(#glow)"/>
  <circle cx="64" cy="36" r="5" fill="#38bdf8"/>

  <circle cx="38" cy="49" r="5" fill="#60a5fa"/>
  <circle cx="90" cy="49" r="5" fill="#60a5fa"/>
  <circle cx="64" cy="64" r="7" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="38" cy="79" r="5" fill="#c084fc"/>
  <circle cx="90" cy="79" r="5" fill="#c084fc"/>

  <circle cx="16" cy="74" r="6" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="112" cy="74" r="6" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="64" cy="92" r="5.5" fill="#f43f5e"/>
  <circle cx="64" cy="120" r="6" fill="#ec4899" filter="url(#glow)"/>
</svg>